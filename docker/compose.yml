# Production-style setup: Leaf Bot server + PostgreSQL.
#   cp docker/.env.example docker/.env   (fill in the values)
#   docker compose -f docker/compose.yml up -d --build
name: leafbot
# Images from elsewhere are pinned to a version and its digest, so a server gets what this release was
# tried with, and a changed or taken-over tag cannot slip other code in. They move with Leaf Bot's
# releases; the *_VERSION variables choose another version (a tag, with or without its digest).
services:
  db:
    image: postgres:${POSTGRES_VERSION:-17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7}
    restart: unless-stopped
    environment:
      # An installation made before the rename keeps yumakbot here (docker/install.sh pins it in .env).
      POSTGRES_USER: ${POSTGRES_USER:-leafbot}
      POSTGRES_DB: ${POSTGRES_DB:-leafbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
    volumes:
      - db:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-leafbot}']
      interval: 5s
      retries: 20
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m

  leafbot:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      # The name exists only on the `computer` network; plain `computer` could resolve to its address
      # on `egress`, where containers cannot reach each other.
      LEAFBOT_COMPUTER_URL: http://computer-api:4320
      LEAFBOT_COMPUTER_TOKEN: ${LEAFBOT_COMPUTER_TOKEN:?LEAFBOT_COMPUTER_TOKEN gerekli}
      DATABASE_URL: postgres://${POSTGRES_USER:-leafbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-leafbot}
      LEAFBOT_ACCESS_KEY: ${LEAFBOT_ACCESS_KEY:?LEAFBOT_ACCESS_KEY gerekli}
      LEAFBOT_ALLOWED_HOSTS: ${LEAFBOT_ALLOWED_HOSTS:-}
      LEAFBOT_SECURE_COOKIES: ${LEAFBOT_SECURE_COOKIES:-0}
      LEAFBOT_PUBLIC_URL: ${LEAFBOT_PUBLIC_URL:-}
      LEAFBOT_PROXY_SECRET: ${LEAFBOT_PROXY_SECRET:-}
      # A SearXNG the bots on API keys search the web with; see "Web araması" in docker/README.md.
      WEB_SEARCH_URL: ${WEB_SEARCH_URL:-}
      # The proxy the browsers this server starts itself (no computer service) leave through; see
      # "Tarayıcının çıkış adresi" in docker/README.md.
      LEAFBOT_EGRESS_PROXY: ${LEAFBOT_EGRESS_PROXY:-}
    # Only on the host's loopback; put a TLS reverse proxy in front for remote use.
    ports: ['127.0.0.1:${LEAFBOT_PORT:-4319}:4319']
    volumes:
      - data:/data
    networks:
      internal: {}
      egress: {}
      computer: {}
      warp: {}
      # The gateway's name for the server. A panel puts every service it routes to on one network it
      # shares with all its apps, where `leafbot` can be another installation's server; this name
      # exists only on this installation's `edge`.
      edge: { aliases: [leafbot-edge] }
      services: {}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      # Chromium keeps its crash reports and some state under home.
      - /home/leafbot:size=256m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - 'no-new-privileges:true'
      # Claude runs each Bash command in its own sandbox (bubblewrap), which needs user namespaces
      # and a fresh /proc. seccomp.json is Docker's default plus those calls; systempaths lets
      # bubblewrap mount /proc. See "Bash yalıtımı" in docker/README.md.
      - 'seccomp=./seccomp.json'
      - 'systempaths=unconfined'
      # Hosts that restrict user namespaces through AppArmor (Ubuntu 23.10 and later) need the
      # leafbot-userns profile; see "AppArmor" in docker/README.md.
      - 'apparmor=${LEAFBOT_APPARMOR:-docker-default}'
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2
    pids_limit: 512

  # The bots' desktops. Each bot gets its own sandboxed session in here; see "Botların bilgisayarı"
  # in docker/README.md. Not on the database network.
  computer:
    build: { context: .., dockerfile: computer/Dockerfile }
    restart: unless-stopped
    # The server creates the bots' folder on the data volume, which this service mounts.
    depends_on:
      leafbot: { condition: service_healthy }
    environment:
      LEAFBOT_COMPUTER_TOKEN: ${LEAFBOT_COMPUTER_TOKEN:?LEAFBOT_COMPUTER_TOKEN gerekli}
      # The proxy the desktops' browsers leave through; see "Tarayıcının çıkış adresi" in
      # docker/README.md.
      LEAFBOT_EGRESS_PROXY: ${LEAFBOT_EGRESS_PROXY:-}
    volumes:
      # Only the bots' folders, at the same path the server sees. `subpath` needs Docker Engine 26+.
      - type: volume
        source: data
        target: /data/workspaces
        volume: { subpath: workspaces }
    networks:
      egress: {}
      computer: { aliases: [computer-api] }
      warp: {}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      # Control directories of the running desktops (cookies, sockets, logs).
      - /run/computer:size=64m,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - 'no-new-privileges:true'
      # Same as the server: each desktop is a bubblewrap sandbox. The profile also allows chroot,
      # which Chromium's own sandbox needs inside it.
      - 'seccomp=./seccomp.json'
      - 'systempaths=unconfined'
      - 'apparmor=${LEAFBOT_APPARMOR:-docker-default}'
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 3
    pids_limit: 2048
    # Chromium and office programs use shared memory.
    shm_size: 512m

  # Optional: the bots' browsers leave through Cloudflare WARP instead of this host's address, which
  # some sites refuse for being a data centre's. Started only with `--profile warp`, and used once
  # LEAFBOT_EGRESS_PROXY points at it; see "Tarayıcının çıkış adresi" in docker/README.md.
  warp:
    build: { context: ./warp }
    profiles: [warp]
    restart: unless-stopped
    # `warp` is where the browsers' services reach it. Its own way out is `egress`, behind
    # docker/firewall.sh like theirs: a desktop's shell shares that service's network and can reach
    # this proxy directly, so what WARP is asked for must not get to private addresses either.
    networks:
      warp: { aliases: [leafbot-warp] }
      egress: {}
    volumes:
      # The free registration, kept across restarts.
      - warp:/var/lib/cloudflare-warp
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /run:size=16m
      - /var/log/cloudflare-warp:size=32m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    pids_limit: 256

  # Optional: reach the server from anywhere through a Cloudflare Tunnel, with no port open on this
  # host and HTTPS from Cloudflare. Started only with `--profile cloudflare`; see "Uzaktan erişim"
  # in docker/README.md.
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d}
    profiles: [cloudflare]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      leafbot: { condition: service_healthy }
    # `edge` reaches the server and nothing else; `outbound` reaches Cloudflare.
    networks: [edge, outbound]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m

  # Optional: the service a hosting panel such as Dokploy routes the domain to, with
  # COMPOSE_PROFILES=gateway; see "Dokploy ve benzeri paneller" in docker/README.md. A panel puts the
  # service its domain points at on its own network, shared with every other app it runs and with a
  # way out of its own. Pointed at the server, that took the server around the egress firewall and
  # next to the panel's databases; pointed here, only this proxy is there, and it reaches the server
  # on `edge` alone.
  gateway:
    # Pinned like the images above; the same Caddy as compose.vps.yml.
    image: caddy:${CADDY_VERSION:-2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0}
    profiles: [gateway]
    restart: unless-stopped
    depends_on:
      leafbot: { condition: service_healthy }
    volumes:
      - ./Caddyfile.gateway:/etc/caddy/Caddyfile:ro
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:size=16m
      # Caddy's data and config folders; it keeps nothing it needs across restarts here.
      - /data:size=16m
      - /config:size=16m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    pids_limit: 128

  # Optional: reach the server from the devices on your tailnet at https://<name>.<tailnet>.ts.net,
  # with no port open on this host. Started only with `--profile tailscale`; see "Uzaktan erişim"
  # in docker/README.md.
  tailscale:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4}
    profiles: [tailscale]
    restart: unless-stopped
    hostname: ${TAILSCALE_HOSTNAME:-leafbot}
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      # No TUN device or extra capabilities: Tailscale runs in user space.
      TS_USERSPACE: 'true'
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    depends_on:
      leafbot: { condition: service_healthy }
    networks: [edge, outbound]
    # In user space Tailscale needs no capability, no TUN device and no writable root: its state is on
    # the volume and its control socket in /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    pids_limit: 128

networks:
  # Database traffic only; no route to the internet.
  internal:
    internal: true
  # Internet access for the server; see docker/firewall.sh to block private ranges. The bridge has a fixed
  # name so the firewall can find it; a host keeps one bridge per name, so a second installation on the
  # same host (or one left from an earlier deploy) needs another LEAFBOT_BRIDGE.
  egress:
    driver_opts:
      com.docker.network.bridge.name: ${LEAFBOT_BRIDGE:-leafbot0}
      com.docker.network.bridge.enable_icc: 'false'
  # Server to computer service only; no route out.
  computer:
    internal: true
  # The server to model services of your own (Whisper, Kokoro, Ollama, SearXNG) that run outside this
  # installation, without joining a panel's shared network (see "Kendi model servisleriniz" in
  # docker/README.md). With LEAFBOT_SERVICES_NETWORK it is that existing network, which the services
  # join too and `down` leaves in place; without it, an empty network of this installation's own with
  # no route out.
  services:
    name: ${LEAFBOT_SERVICES_NETWORK:-${COMPOSE_PROJECT_NAME}_services}
    internal: true
  # A tunnel (Cloudflare, Tailscale) to the server only; no route out, so it adds none for the server.
  edge:
    internal: true
  # The tunnel's own way out to its service.
  outbound: {}
  # The browsers' services to the WARP proxy only; no route out.
  warp:
    internal: true

volumes:
  db:
  data:
  tailscale:
  warp:
