packages:
  - shared
  - client
  - server
  - app
  - desktop
  - computer
  - mobile
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  '@google/genai': false
  protobufjs: false
  '@whiskeysockets/baileys': false
minimumReleaseAgeExclude:
  - '@hookform/resolvers@7.0.6'
  - electron@45.3.1
  - framer-motion@14.13.0
  - motion-dom@14.13.0
  - motion@14.13.0
  - open-bot-avatar@0.5.0
  - prettier@3.10.1
# Dependencies of dependencies moved past versions with published advisories, until the packages that
# pull them in ask for fixed versions themselves:
#   katex (rehype-katex, remark-math): prototype pollution could bypass the `trust` option. The app
#     already uses 0.19 directly, so formulas are drawn by the version whose styles the page loads.
#   esbuild (drizzle-kit, a development tool): its development server answered any website.
#   minimatch 7 to 11.0.0 (eslint and electron-builder tools): denial of service through a pattern.
#   zod 3 (sandbox-runtime): a large array could exhaust memory while it was checked, and no 3.x
#     release fixes it. The package reads zod only through `zod/v3`, which zod 4 also ships.
#   image-size (pptxgenjs): its ICNS, JXL and HEIF parsers could loop forever on a crafted image, and
#     no 1.x release fixes it. pptxgenjs lists the package but never loads it, so the 2.x API change
#     does not reach it.
overrides:
  'katex@<0.18.2': 0.19.1
  'esbuild@<0.24.3': 0.25.12
  'minimatch@>=7.0.0 <11.0.1': 11.0.8
  '@anthropic-ai/sandbox-runtime>zod': 4.6.7
  'image-size@<2.0.3': 2.0.4
