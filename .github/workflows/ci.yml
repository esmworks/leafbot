name: CI

# Automatic runs are off for now; run it by hand from the Actions tab.
# To turn them back on, add the push (branches: [main]) and pull_request triggers here again.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to a commit, with the release it is in next to it, so a moved tag
# cannot change what runs here.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Install and test scripts have no use for the token, so it is not stored in the checkout.
          persist-credentials: false
      # pnpm sürümü package.json'daki packageManager alanından okunur.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # poppler-utils: the PDF reading test runs the real pdfinfo, pdftotext and pdftoppm.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Derleme testlerden önce: masaüstü testleri derlenmiş sunucuyu başlatır.
      - run: pnpm build
      - run: pnpm test
