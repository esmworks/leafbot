# Packaging settings. The server and app are built first (pnpm build at the root).
appId: com.esmworks.leafbot
# The name people read: the app bundle, the menu bar title (macOS takes it from the bundle, not
# from the menu), the Windows exe and shortcuts. Installer and update file names keep "LeafBot"
# below: a space in a release asset's name does not survive the upload, and the update information
# must name the file as it was uploaded.
productName: Leaf Bot
copyright: Copyright (C) 2026 esmworks (Erhan Erbaş)
directories:
  output: out
# Where releases live. The release workflow uploads the installers itself (--publish never), along
# with the update information electron-builder writes for this target (latest*.yml, *.blockmap):
# an installed app reads it from the latest published release to update itself.
publish:
  provider: github
  owner: esmworks
  repo: leafbot
# `leafbot://` links open a chat in the app (desktop/src/links.ts), and `yumakbot://` links made
# before the rename. macOS reads the schemes from the bundle and Linux from the desktop file; Windows
# registers them when the app starts.
protocols:
  - name: Leaf Bot
    schemes:
      - leafbot
      - yumakbot
files:
  - dist/**
  - package.json
# Electron's build-time switches, flipped in the packaged binary so that nobody can start this signed
# app as something else: no --inspect debugger or NODE_OPTIONS to inject code, app code only from the
# app.asar archive, whose hash is checked on load (macOS and Windows), and cookies encrypted with the
# same keychain key as the saved access key.
electronFuses:
  # Stays on: the app starts its server as a Node process of its own binary (ELECTRON_RUN_AS_NODE, see
  # src/server-process.ts). The server's environment is built from scratch, without NODE_OPTIONS.
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  # The app's pages come from the server over http(s); the connect page is the only file:// page and
  # needs nothing beyond what a browser gives a file.
  grantFileProtocolExtraPrivileges: false
  # Flipping a fuse changes the binary and breaks its signature. Without a Developer ID (a build with
  # no certificate) electron-builder does not sign again, and Apple silicon refuses to start a binary
  # whose signature is broken, so it is signed again ad hoc right after; a signed build is then signed
  # properly on top.
  resetAdHocDarwinSignature: true
# The server (bundle plus production node_modules, from `pnpm stage`) is copied by
# after-pack.cjs: extraResources would leave node_modules out.
afterPack: ./after-pack.cjs
extraResources:
  - from: ../app/dist
    to: app
  - from: assets
    to: assets
  # The license and its notices travel with every copy.
  - from: ../LICENSE
    to: LICENSE
  - from: ../NOTICE
    to: NOTICE
mac:
  # An Icon Composer icon: the dark tile as one layer and the bot as its own, so macOS draws the light
  # rim of glass round the bot as on its own icons. electron-builder compiles it with Xcode 26's actool
  # and makes the .icns earlier macOS versions read from it.
  icon: assets/icon.icon
  category: public.app-category.productivity
  target:
    - dmg
    # The zip is what an installed app downloads to update itself; macOS cannot update from a dmg.
    - zip
  artifactName: LeafBot-${version}-${arch}-mac.${ext}
  extendInfo:
    LSUIElement: false
    # What macOS shows when the app first asks for the microphone (the message box's mic button).
    NSMicrophoneUsageDescription: Leaf Bot uses the microphone only when you press the microphone button to speak a message.
    # Commands a bot runs from the app (coding agents on this Mac) may read these; without a
    # description macOS refuses the request silently instead of asking the person.
    NSCalendarsUsageDescription: A bot you allowed to use this Mac may read or add calendar events when you ask it to.
    NSCalendarsFullAccessUsageDescription: A bot you allowed to use this Mac may read or add calendar events when you ask it to.
    NSRemindersUsageDescription: A bot you allowed to use this Mac may read or add reminders when you ask it to.
    NSRemindersFullAccessUsageDescription: A bot you allowed to use this Mac may read or add reminders when you ask it to.
    NSContactsUsageDescription: A bot you allowed to use this Mac may look up your contacts when you ask it to.
  # Signed with the Developer ID in the keychain, or the one in CSC_LINK / CSC_KEY_PASSWORD on CI,
  # and sent to Apple for notarization when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID
  # are set, so the downloaded app opens without the "unidentified developer" warning. Without
  # them the build still succeeds, unsigned or not notarized.
  # The helper that moves the mouse and types for a bot the person allowed to use this Mac
  # (build.mjs compiles it).
  extraResources:
    - from: dist/person-computer
      to: person-computer
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: true
win:
  icon: assets/icon.png
  target: nsis
linux:
  icon: assets/icon.png
  category: Office
  # The AppImage runs on most distributions and updates itself (latest-linux.yml); the .deb is
  # for Debian and Ubuntu, installed and updated by hand.
  target:
    - AppImage
    - deb
  artifactName: LeafBot-${version}-${arch}.${ext}
  maintainer: esmworks <info@leafbot.app>
  synopsis: Your own team of AI bots
  executableName: leafbot
deb:
  # Chromium's sandbox and the bots' browser need these on a minimal install.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  # The sandbox that keeps a bot's shell commands to its own folders.
  recommends:
    - bubblewrap
    - socat
    # Claude's Read tool turns chosen PDF pages into pictures with it; a long scanned PDF needs it.
    - poppler-utils
nsis:
  # A per-user install needs no administrator rights; the user still picks the folder.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: LeafBot-${version}-Setup.${ext}
dmg:
  artifactName: LeafBot-${version}-${arch}.${ext}
  # The stock background is 380 high with the icons at y 220, which leaves an empty band above
  # them. This one is shorter and puts the icons and the arrow in the middle of what Finder shows
  # (the window's height includes its title bar, so about 30 at the bottom of the image is hidden).
  # The window takes the image's size; background@2x.png next to it is used on Retina screens.
  # The PNGs are drawn from background.svg:
  #   rsvg-convert -w 540 -h 280 dmg/background.svg -o dmg/background.png
  #   rsvg-convert -w 1080 -h 560 dmg/background.svg -o dmg/background@2x.png
  background: dmg/background.png
  contents:
    - x: 130
      y: 110
      type: file
    - x: 410
      y: 110
      type: link
      path: /Applications
