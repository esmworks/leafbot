<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title data-i18n="title">Uzak sunucuya bağlan</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #1d1d1f;
        --muted: #6b6b70;
        --field: #ececee;
        --accent: #2b8152;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1b1b;
          --fg: #f2f2f2;
          --muted: #a0a0a6;
          --field: #2a2a2c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px -apple-system,
          system-ui,
          sans-serif;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 6px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      input {
        width: 100%;
        height: 40px;
        border-radius: 20px;
        border: 0;
        padding: 0 16px;
        background: var(--field);
        color: var(--fg);
        font: inherit;
        outline: none;
      }
      input:focus {
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 50%, transparent);
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 22px;
      }
      button {
        height: 40px;
        border-radius: 20px;
        border: 0;
        padding: 0 18px;
        font: inherit;
        cursor: pointer;
      }
      .primary {
        background: var(--accent);
        color: #fff;
        flex: 1;
      }
      .ghost {
        background: transparent;
        color: var(--fg);
      }
      .error {
        color: #e5484d;
        margin-top: 12px;
        min-height: 18px;
      }
      .new {
        margin: 16px 0 0;
        font-size: 13px;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="title">Uzak sunucuya bağlan</h1>
    <p data-i18n="intro">
      Botlar o sunucuda çalışır; bu Mac yalnızca pencere olur. Anahtar macOS anahtar zincirinde şifreli
      saklanır.
    </p>
    <form id="f">
      <label for="url" data-i18n="url">Sunucu adresi</label>
      <input
        id="url"
        data-i18n-placeholder="urlPlaceholder"
        placeholder="https://leafbot.ornek.com"
        required
        autofocus
      />
      <label for="key" data-i18n="key">Erişim anahtarı ya da eşleştirme kodu</label>
      <input id="key" type="password" required />
      <div class="error" id="err"></div>
      <div class="row">
        <button type="button" class="ghost" id="local" data-i18n="local">Bu Mac'i kullan</button>
        <button type="submit" class="primary" id="go" data-i18n="connect">Bağlan</button>
      </div>
    </form>
    <!-- A server not set up yet has no address or key: the account's page gives the install command
         that sets it up and adds it to the account. The shell opens the link in the browser. -->
    <p class="new">
      <span data-i18n="newServer">Yeni bir sunucu mu kuruyorsunuz?</span>
      <a href="https://www.leafbot.app/setup" target="_blank" data-i18n="newServerLink"
        >Kurulum komutunu hesabınızdan alın</a
      >
    </p>
    <script>
      const $ = (id) => document.getElementById(id);
      // The shell passes the app's language as ?lang=; the markup above is the Turkish default.
      const TEXT = {
        tr: {
          title: 'Uzak sunucuya bağlan',
          intro:
            'Botlar o sunucuda çalışır; bu Mac yalnızca pencere olur. Anahtar macOS anahtar zincirinde şifreli saklanır.',
          url: 'Sunucu adresi',
          urlPlaceholder: 'https://leafbot.ornek.com',
          key: 'Erişim anahtarı ya da eşleştirme kodu',
          local: "Bu Mac'i kullan",
          connect: 'Bağlan',
          failed: 'Bağlanılamadı',
          newServer: 'Yeni bir sunucu mu kuruyorsunuz?',
          newServerLink: 'Kurulum komutunu hesabınızdan alın',
        },
        en: {
          title: 'Connect to a remote server',
          intro:
            'The bots run on that server; this Mac is only the window. The key is stored encrypted in the macOS keychain.',
          url: 'Server address',
          urlPlaceholder: 'https://leafbot.example.com',
          key: 'Access key or pairing code',
          local: 'Use this Mac',
          connect: 'Connect',
          failed: 'Could not connect',
          newServer: 'Setting up a new server?',
          newServerLink: 'Get its install command from your account',
        },
      };
      const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'tr';
      const text = TEXT[lang];
      document.documentElement.lang = lang;
      for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = text[el.dataset.i18n];
      for (const el of document.querySelectorAll('[data-i18n-placeholder]'))
        el.placeholder = text[el.dataset.i18nPlaceholder];
      $('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        $('go').disabled = true;
        $('err').textContent = '';
        const r = await window.leafbotDesktop.connectRemote($('url').value, $('key').value);
        if (!r.ok) $('err').textContent = r.error || text.failed;
        $('go').disabled = false;
      });
      $('local').addEventListener('click', () => window.leafbotDesktop.useLocal());
    </script>
  </body>
</html>
